plugins { id "com.android.application" }

def runNumber = (System.getenv("GITHUB_RUN_NUMBER") ?: "1") as Integer

android {
    namespace "br.caiapo.condominio"
    compileSdk 34
    defaultConfig {
        applicationId "br.caiapo.condominio"
        minSdk 24
        targetSdk 34
        versionCode runNumber
        versionName "1.0." + runNumber
    }
    signingConfigs {
        caiapo {
            storeFile file("caiapo.keystore")
            storePassword "caiapo2026"
            keyAlias "caiapo"
            keyPassword "caiapo2026"
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.caiapo
        }
        debug { signingConfig signingConfigs.caiapo }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies { implementation "androidx.core:core:1.13.1"
    implementation "androidx.exifinterface:exifinterface:1.3.7" }
