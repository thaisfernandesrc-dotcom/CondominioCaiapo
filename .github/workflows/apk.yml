name: Gerar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Baixar biblioteca de imagem do balancete
        run: curl -fsSL https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js -o app/src/main/assets/html2canvas.min.js

      - name: Compilar
        run: gradle :app:assembleRelease --no-daemon

      - name: Renomear APK
        run: cp app/build/outputs/apk/release/app-release.apk condominio-caiapo.apk

      - uses: actions/upload-artifact@v4
        with:
          name: condominio-caiapo-apk
          path: condominio-caiapo.apk

      - name: Publicar versão
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Condomínio Caiapó 1.0.${{ github.run_number }}
          files: condominio-caiapo.apk
          make_latest: true
